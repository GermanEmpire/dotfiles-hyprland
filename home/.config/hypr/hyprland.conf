# =========================
# HYPRLAND CONFIG
# =========================

# VARIABLES
$ipc = qs -c noctalia-shell ipc call
$mod = SUPER
$term = kitty
$menu = $ipc launcher toggle

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,gtk3

# =========================
# MONITORS
# check names rith: hyprctl monitors
# =========================
monitor = DP-2,2560x1440@200,0x0,1

# =========================
# INPUT
# =========================
input {
    kb_layout = tr
     sensitivity = -0.4
}

# =========================
# GENERAL APPEARANCE
# =========================

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 1
  col.active_border = rgb(332d49)
  col.inactive_border = rgb(000000)
}

decoration {
  rounding = 20
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

# =========================
# ANIMATIONS
# =========================
animations {
  enabled = yes

  bezier = smooth, 0.25, 0.9, 0.1, 1.0

  animation = windows, 1, 4, smooth, slide
  animation = windowsIn, 1, 4, smooth,
  animation = windowsOut, 1, 4, smooth,
  animation = windowsMove, 1, 3, smooth,

  animation = fade, 1, 3, smooth
  animation = fadeIn, 1, 3, smooth
  animation = fadeOut, 1, 3, smooth

  animation = workspaces, 1, 4, smooth, slidefade 15%
}

# =========================
# WALLPAPER
# =========================
exec-once = hyprpaper

# Put this in ~/.config/hypr/hyprpaper.conf:
# preload = ~/.local/share/wallpapers/a7x-purple.png
# wallpaper = ,~/.local/share/wallpapers/a7x-purple.png

# =========================
# AUTOSTART
# =========================
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = qs -c noctalia-shell

# autotiling equivalent
exec-once = hyprctl keyword general:layout dwindle

# =========================
# TERMINAL
# =========================
bind = $mod, RETURN, exec, $term

# =========================
# APPLICATION LAUNCHER
# =========================
bind = $mod, A, exec, $menu

# =========================
# CONTROL PANEL
# =========================
bind = $mod SHIFT, A, exec, $ipc controlCenter toggle

# =========================
# POWER MENU
# =========================
bind = $mod SHIFT, Q, exec, $ipc sessionMenu toggle

# =========================
# RELOAD CONFIG
# =========================
bind = $mod SHIFT, R, exec, qs -c noctalia-shell

# =========================
# CLOSE WINDOW
# =========================
bind = $mod, Q, killactive,

# =========================
# SCREENSHOT
# =========================
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# =========================
# FILE MANAGER
# =========================
bind = $mod, E, exec, thunar

# =========================
# BTOP
# =========================
bind = CTRL SHIFT, Escape, exec, kitty -e btop --tty

# =========================
# FOCUS MOVEMENT
# =========================
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# =========================
# MOVE WINDOWS
# =========================
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# =========================
# WORKSPACE SWITCHING
# =========================
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# =========================
# MOVE WINDOW TO WORKSPACE
# =========================
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# =========================
# FLOATING
# =========================
bind = $mod, SPACE, togglefloating,

# =========================
# FULLSCREEN
# =========================
bind = $mod, F, fullscreen

# =========================
# BRIGHTNESS
# =========================
bindle = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindle = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# =========================
# VOLUME
# =========================
bindle = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindle = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindle = , XF86AudioMute, exec, $ipc volume muteOutput

# =========================
# RESIZE
# =========================
bind = $mod, R, submap, resize

submap = resize
bind = , left, resizeactive, -10 0
bind = , right, resizeactive, 10 0
bind = , up, resizeactive, 0 -10
bind = , down, resizeactive, 0 10
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
submap = reset

# =========================
# MOUSE
# =========================
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
