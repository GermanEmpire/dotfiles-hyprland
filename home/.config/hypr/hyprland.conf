# =========================
# HYPRLAND CONFIG
# =========================

# VARIABLES
$mod = SUPER
$term = kitty
$menu = rofi -show drun -theme ~/.config/rofi/launcher/launcher.rofi

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# =========================
# MONITORS
# check names rith: hyprctl monitors
# =========================
monitor = eDP-1,1920x1080,2560x0,1
monitor = HDMI-A-3,2560x1440@144,0x0,1

# =========================
# INPUT
# =========================
input {
    kb_layout = tr
    accel_profile = adaptive
}

# =========================
# GENERAL APPEARANCE
# =========================
general {
    gaps_in = 8
    gaps_out = 8
    border_size = 1

    col.active_border = rgb(332d49)
    col.inactive_border = rgb(000000)

    layout = dwindle
}

# =========================
# DECORATION
# =========================
decoration {
    rounding = 0
}

# =========================
# ANIMATIONS
# =========================
animations {
  enabled = yes

  bezier = smooth, 0.25, 0.9, 0.1, 1.0

  animation = windows, 1, 4, smooth, slide
  animation = windowsIn, 1, 4, smooth,
  animation = windowsOut, 1, 4, smooth,
  animation = windowsMove, 1, 3, smooth,

  animation = fade, 1, 3, smooth
  animation = fadeIn, 1, 3, smooth
  animation = fadeOut, 1, 3, smooth

  animation = workspaces, 1, 4, smooth, slidefade 15%
}

# =========================
# WALLPAPER
# =========================
exec-once = hyprpaper

# Put this in ~/.config/hypr/hyprpaper.conf:
# preload = ~/.local/share/wallpapers/a7x-purple.png
# wallpaper = ,~/.local/share/wallpapers/a7x-purple.png

windowrulev2 = pin, title:^(Picture in picture)$

# =========================
# AUTOSTART
# =========================
exec-once = dunst
exec-once = nm-applet
exec-once = batsignal
exec-once = redshift
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hypridle

# autotiling equivalent
exec-once = hyprctl keyword general:layout dwindle

# =========================
# TERMINAL
# =========================
bind = $mod, RETURN, exec, $term

# =========================
# APPLICATION LAUNCHER
# =========================
bind = $mod, A, exec, $menu

# =========================
# ROFI TRANSLATE
# =========================
bind = $mod SHIFT, W, exec, sh ~/.config/rofi/translate/translate.sh

# =========================
# POWER MENU
# =========================
bind = $mod SHIFT, Q, exec, sh ~/.config/rofi/powermenu/powermenu.sh

# =========================
# CLOSE WINDOW
# =========================
bind = $mod, Q, killactive,

# =========================
# SCREENSHOT
# =========================
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# =========================
# FILE MANAGER
# =========================
bind = $mod, E, exec, thunar

# =========================
# BTOP
# =========================
bind = CTRL SHIFT, Escape, exec, kitty -e btop

# =========================
# FOCUS MOVEMENT
# =========================
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# =========================
# MOVE WINDOWS
# =========================
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# =========================
# WORKSPACE SWITCHING
# =========================
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# =========================
# MOVE WINDOW TO WORKSPACE
# =========================
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# =========================
# FLOATING
# =========================
bind = $mod, SPACE, togglefloating

# =========================
# FULLSCREEN
# =========================
bind = $mod, F, fullscreen

# =========================
# BRIGHTNESS
# =========================
bindle = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh +5%
bindle = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh 5%-

# =========================
# VOLUME
# =========================
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/hypr/scripts/volume.sh
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/hypr/scripts/volume.sh
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/volume.sh

# =========================
# RESIZE
# =========================
bind = $mod, R, submap, resize

submap = resize
bind = , left, resizeactive, -10 0
bind = , right, resizeactive, 10 0
bind = , up, resizeactive, 0 -10
bind = , down, resizeactive, 0 10
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
submap = reset

# =========================
# MOUSE
# =========================
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
